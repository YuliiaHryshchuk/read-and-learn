services:
  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://study_reader:study_reader@db:5432/study_reader
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: study_reader
      POSTGRES_USER: study_reader
      POSTGRES_PASSWORD: study_reader
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U study_reader -d study_reader"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  web_node_modules:
