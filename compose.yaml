services:
  web:
    build: .
    command: pnpm dev:docker
    ports:
      - "3000:3000"
    environment:
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: "false"
    volumes:
      - .:/app
      - web_node_modules_debian:/app/node_modules
      - web_next:/app/.next

volumes:
  web_node_modules_debian:
  web_next:
